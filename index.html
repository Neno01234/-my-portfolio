<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Interactive Web & Simulation Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            padding: 20px 0;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff 0%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 650px;
            margin: 0 auto;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-cyan);
            box-shadow: 0 12px 30px rgba(6, 182, 212, 0.15);
        }

        .tag-group {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-cyan);
        }

        .card h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.35rem;
            margin-bottom: 12px;
            color: #fff;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
            flex-grow: 1;
        }

        .btn-launch {
            display: inline-block;
            text-align: center;
            width: 100%;
            padding: 12px 0;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: opacity 0.2s;
        }

        .btn-launch:hover {
            opacity: 0.9;
        }

        footer {
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <span class="badge">Interactive Web & Simulations</span>
            <h1>Creative Tech Portfolio</h1>
            <p class="hero-desc">Building high-impact 3D product configurators, data visualizers, and interactive simulations powered by modern web technologies.</p>
        </header>

        <div class="projects-grid">
            
            <!-- Project 1: Headphones -->
<a href="headphones.html" target="_blank" class="btn-launch">Launch Interactive Demo ↗</a>
</div>
</div>

<!-- Project 2: Snowball Effect -->
<a href="snowball.html" target="_blank" class="btn-launch">Launch Interactive Demo ↗</a>
</div>
</div>

<!-- Project 3: Stellar Collapse -->
<a href="stellar.html" target="_blank" class="btn-launch">Launch Interactive Demo ↗</a>
</div>
</div>

</div>

<footer>
    <p>© 2026 Interactive Portfolio</p>
</footer>
</div>

</body>
</html>
